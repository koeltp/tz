<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>投资仪表板 - TP投资</title>
  <link rel="icon" href="images/logo.png" type="image/x-icon" />
  <meta name="keywords" content="投资仪表板, 资产趋势, 投资绩效, TP投资" />
  <meta name="description" content="TP投资仪表板，展示每周总资产趋势图表和投资绩效分析。" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PK7GS5KGYF"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-PK7GS5KGYF');
  </script>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print"
    onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </noscript>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>

  <script charset="UTF-8" id="LA_COLLECT" src="//sdk.51.la/js-sdk-pro.min.js"></script>
  <script>
    LA.init({
      id: "3OgR3Wy34bzHyG7a",
      ck: "3OgR3Wy34bzHyG7a",
      autoTrack: true,
      hashMode: true,
      screenRecord: true,
    });
  </script>
</head>

<body>
  <header class="header">
    <div class="container">
      <div class="logo">
        <a href="index.html">
          <img src="images/logo.png" alt="TP投资 Logo" class="logo-image" />
          <div class="logo-text">TP投资</div>
        </a>
      </div>

      <button class="nav-toggle" id="navToggle">
        <i class="fas fa-bars"></i>
      </button>

      <ul class="header-nav" id="headerNav">
        <li class="header-nav-item">
          <a href="index.html" class="header-nav-link">
            <i class="fas fa-home"></i>
            <span>首页</span>
          </a>
        </li>
        <li class="header-nav-item">
          <a href="dashboard.html" class="header-nav-link active">
            <i class="fas fa-chart-line"></i>
            <span>仪表板</span>
          </a>
        </li>
        <li class="header-nav-item">
          <a href="partner.html" class="header-nav-link">
            <i class="fas fa-users"></i>
            <span>合伙人</span>
          </a>
        </li>
        <li class="header-nav-item">
          <a href="timeline.html" class="header-nav-link">
            <i class="fas fa-history"></i>
            <span>时光机</span>
          </a>
        </li>
        <li class="header-nav-item">
          <a href="exchange.html" class="header-nav-link">
            <i class="fas fa-exchange-alt"></i>
            <span>汇率查询</span>
          </a>
        </li>
        <li class="header-nav-item">
          <a href="about.html" class="header-nav-link">
            <i class="fas fa-info-circle"></i>
            <span>关于我们</span>
          </a>
        </li>
        <li class="header-nav-item dropdown">
          <a href="#" class="header-nav-link dropdown-toggle">
            <i class="fas fa-exchange-alt"></i>
            <span id="current-source">TP投资</span>
            <i class="fas fa-chevron-down dropdown-arrow"></i>
          </a>
          <ul class="dropdown-menu">
            <!-- 下拉菜单选项将通过JS动态加载 -->
          </ul>
        </li>
      </ul>
    </div>
  </header>

  <main class="container">
    <section class="dashboard-header">
      <h1><i class="fas fa-chart-line"></i> 投资仪表板</h1>
      <p class="dashboard-subtitle">每周总资产趋势分析</p>
    </section>

    <section class="dashboard-content">
      <div class="dashboard-card">
        <div class="card-header">
          <h2><i class="fas fa-chart-line"></i> 资产与收益率趋势</h2>
        </div>
        <div class="card-body">
          <div class="chart-container">
            <canvas id="combinedTrendChart"></canvas>
          </div>
        </div>
      </div>

      <div class="dashboard-card">
        <div class="card-header">
          <h2><i class="fas fa-globe"></i> 综合总资产（所有站点）</h2>
        </div>
        <div class="card-body">
          <div class="chart-container">
            <canvas id="combinedAssetsChart"></canvas>
          </div>
        </div>
      </div>
      <div class="dashboard-card">
        <div class="card-header">
          <h2><i class="fas fa-chart-pie"></i> 站点资产分布</h2>
        </div>
        <div class="card-body">
          <div class="chart-row">
            <div class="chart-col">
              <h3 class="chart-title"><i class="fas fa-dollar-sign"></i> USD 站点</h3>
              <div class="chart-container">
                <canvas id="usdPolarChart"></canvas>
              </div>
            </div>
            <div class="chart-col">
              <h3 class="chart-title"><i class="fas fa-yen-sign"></i> CNY 站点</h3>
              <div class="chart-container">
                <canvas id="cnyPolarChart"></canvas>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="dashboard-card">
        <div class="card-header">
          <h2><i class="fas fa-trophy"></i> 投资绩效</h2>
        </div>
        <div class="card-body">
          <div class="stats-grid">
            <div class="stat-item">
              <span class="stat-label">当前总资产</span>
              <span class="stat-value" id="current-assets"></span>
            </div>
            <div class="stat-item">
              <span class="stat-label">累计收益</span>
              <span class="stat-value" id="total-change"></span>
            </div>
            <div class="stat-item">
              <span class="stat-label">收益率</span>
              <span class="stat-value" id="return-rate"></span>
            </div>
            <div class="stat-item">
              <span class="stat-label">资金流入</span>
              <span class="stat-value" id="cash-inflow"></span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <!-- 页脚内容由footer.js动态生成 -->
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/source-switcher.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/dashboard.js"></script>
</body>

</html>
